<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>JustDoIt! - Tareas de Usuario</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
<div class="container">

    <!-- Left column -->
    <aside class="sidebar">
        <div class="logo">
            <a th:href="@{/}"><img th:src="@{/images/JustDoIt.png}" alt="JustDoIt Logo" width="200" height="200"></a>
        </div>

        <nav class="navigation">
            <h3>Tareas</h3>
            <ul>
                <li><a th:href="@{/user/tasks}">Tareas de usuario actual</a></li>
                <li><a th:href="@{/user/tasks/report}">Reporte de tareas</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Right column -->
    <main class="content">
        <h1>Reporte de tareas del usuario</h1>

        <!-- User info (Fragmento reutilizable)-->
        <div th:replace="~{fragments/user-info :: userInfo}"></div>

        <!-- Tabla de tareas -->
        <table class="task-table">
            <thead>
            <tr>
                <th>Tarea</th>
                <th>Estado</th>
                <th>Fecha Límite</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="task : ${user.tasks}">
                <td th:text="${task.description}"></td>
                <td th:text="${task.status == T(teccr.justdoitcloud.data.Task.Status).DONE} ? 'Completada' :
                                 (${task.status == T(teccr.justdoitcloud.data.Task.Status).INPROGRESS} ? 'En progreso' :
                                 'Pendiente')">
                </td>
                <td th:text="${task.deadline != null} ?
                        ${#temporals.format(task.deadline, 'dd/MMMM/yyyy')} :
                        'No especificada'">
                </td>
            </tr>
            </tbody>
        </table>

    </main>
</div>
</body>
</html>
